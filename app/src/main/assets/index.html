<title>АТЛЕТ — дневник тренировок</title>
<style>:root{--bg:#0a1220;--surface:#121d30;--surface2:#19273d;--ink:#f4f8ff;--muted:#94a6c0;--line:#283851;--accent:#4ce7bb;--accent2:#3f83ef;--amber:#f5c768;--red:#fb8192}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.42 -apple-system,BlinkMacSystemFont,"Roboto","Segoe UI",Arial,sans-serif;min-height:100dvh}button,input,select,textarea{font:inherit}button{cursor:pointer}button:active{transform:scale(.985)}.app-head{height:68px;padding:14px 19px 8px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid rgba(255,255,255,.035);position:sticky;top:0;background:rgba(10,18,32,.94);backdrop-filter:blur(12px);z-index:10}.wordmark{display:flex;gap:11px;align-items:center;font-size:18px;letter-spacing:1px;font-weight:850}.wordmark small{display:block;color:var(--muted);font-size:9px;letter-spacing:2.8px;font-weight:500;margin-top:-2px}.logo{height:36px;width:36px;display:grid;place-items:center;background:var(--accent);color:#08131b;border-radius:11px;font-weight:950;font-size:23px;transform:skew(-5deg)}.header-icon{font-size:12px;color:var(--muted)}main{max-width:740px;margin:auto;padding:19px 16px 105px}.tabbar{position:fixed;bottom:0;left:0;right:0;background:rgba(18,29,48,.96);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:7px 6px max(8px,env(safe-area-inset-bottom));z-index:20;backdrop-filter:blur(16px)}.tabbar button{background:none;border:0;color:var(--muted);padding:5px 8px;min-width:69px;display:flex;align-items:center;flex-direction:column;gap:1px;font-size:11px;font-weight:600}.tabbar button.active{color:var(--accent)}.tab-icon{font-size:24px;line-height:27px;font-weight:400}.eyebrow{color:var(--accent);font-size:11px;font-weight:800;letter-spacing:2.5px;text-transform:uppercase}.page-title{font-size:29px;line-height:1.15;margin:5px 0 9px;letter-spacing:-.7px}.muted{color:var(--muted)}.tiny{font-size:12px}.small{font-size:13px}.no-margin{margin:0}.space{height:16px}.row{display:flex;align-items:center;gap:9px}.spread{justify-content:space-between}.between{display:flex;align-items:center;justify-content:space-between;gap:8px}.card{background:var(--surface);border:1px solid rgba(144,165,193,.10);border-radius:19px;padding:17px;margin:12px 0;box-shadow:0 5px 16px rgba(0,0,0,.09)}.hero{background:linear-gradient(122deg,#153550 0%,#14273e 58%,#173b34 100%);border:1px solid rgba(76,231,187,.16);padding:20px;border-radius:21px;position:relative;overflow:hidden}.hero:before{content:"";position:absolute;right:-48px;top:-70px;width:170px;height:170px;border:28px solid rgba(76,231,187,.06);border-radius:50%}.hero h1{font-size:28px;line-height:1.12;letter-spacing:-.5px;max-width:260px;margin:11px 0}.hero p{max-width:310px;color:#c2d8e8;margin:0 0 19px;font-size:13px}.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid transparent;border-radius:12px;padding:12px 15px;font-weight:750;font-size:14px;white-space:normal;text-align:center;min-height:44px}.btn-primary{background:var(--accent);color:#081921}.btn-secondary{background:var(--surface2);color:var(--ink);border-color:var(--line)}.btn-outline{background:transparent;color:var(--accent);border-color:rgba(76,231,187,.38)}.btn-danger{background:rgba(251,129,146,.10);color:var(--red);border-color:rgba(251,129,146,.3)}.btn-full{width:100%}.btn-small{font-size:12px;padding:7px 10px;min-height:34px;border-radius:9px}.btn:disabled{opacity:.45}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{background:var(--surface);border:1px solid var(--line);border-radius:15px;padding:13px}.stat-label{color:var(--muted);font-size:11px;margin-bottom:7px}.stat-value{font-size:24px;font-weight:830;letter-spacing:-.7px}.stat-unit{font-size:12px;font-weight:500;color:var(--muted);margin-left:2px}.section-title{font-size:17px;font-weight:790;margin:23px 0 10px}.pill{display:inline-flex;color:var(--accent);border-radius:50px;background:rgba(76,231,187,.10);padding:5px 9px;font-weight:720;font-size:11px}.pill.blue{color:#9fc5ff;background:rgba(63,131,239,.14)}.pill.amber{color:var(--amber);background:rgba(245,199,104,.12)}.label{font-size:12px;color:var(--muted);font-weight:600;display:block;margin-bottom:6px}.field{color:var(--ink);background:#0c1829;border:1px solid var(--line);width:100%;padding:12px;border-radius:12px;outline:none;min-height:44px}.field:focus{border-color:var(--accent2)}textarea.field{min-height:80px;resize:vertical}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.exercise{padding:14px 13px;margin:10px 0;border-radius:16px;background:var(--surface);border:1px solid var(--line)}.exercise-name{font-size:15px;font-weight:780}.ex-info{font-size:11px;color:var(--muted);margin-top:4px}.ex-hint{font-size:11px;color:#bfd0e3;margin-top:8px;line-height:1.4}.exo-head{display:flex;justify-content:space-between;gap:7px;align-items:center}.set-head,.setrow{display:grid;grid-template-columns:35px 1fr 1fr 45px;align-items:center;gap:6px}.set-head{font-size:10px;color:var(--muted);padding:12px 0 5px;text-align:center}.setrow{margin-bottom:7px}.setrow .field{padding:9px 4px;min-height:42px;text-align:center;font-size:15px}.setnum{color:var(--muted);text-align:center;font-weight:700;font-size:13px}.check{appearance:none;-webkit-appearance:none;width:28px;height:28px;margin:auto;display:block;border-radius:9px;border:2px solid #45607a;background:#0a1726}.check:checked{background:var(--accent);border-color:var(--accent)}.check:checked:after{content:'✓';display:block;text-align:center;line-height:23px;color:#081921;font-weight:900}.setrow.done .field{border-color:rgba(76,231,187,.35)}.progressline{height:8px;border-radius:20px;background:#26364b;overflow:hidden;margin:10px 0}.progressline span{display:block;background:linear-gradient(90deg,var(--accent2),var(--accent));height:100%;border-radius:20px}.line{height:1px;background:var(--line);margin:12px 0}.list-item{padding:12px 0;border-bottom:1px solid var(--line)}.list-item:last-child{border-bottom:0}.day-pick{display:flex;gap:8px}.day-pick button{flex:1;text-align:center;border:1px solid var(--line);background:var(--surface);border-radius:12px;color:var(--muted);padding:11px 4px}.day-pick button.active{color:var(--accent);border-color:var(--accent);background:rgba(76,231,187,.08)}.day-pick b{display:block;font-size:14px;color:inherit}.day-pick span{font-size:11px}.chart{width:100%;height:auto;display:block;min-height:125px}.tag{border-radius:7px;background:#243447;color:#aac0d5;padding:3px 6px;display:inline-block;font-size:10px}.toast{pointer-events:none;position:fixed;z-index:100;bottom:85px;left:50%;transform:translateX(-50%) translateY(10px);background:#def5ee;color:#0a2923;border-radius:11px;padding:11px 16px;font-size:13px;font-weight:800;opacity:0;transition:.22s;width:max-content;max-width:88vw;text-align:center;box-shadow:0 9px 34px #0008}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}.choose{border:1px solid var(--line);padding:12px;border-radius:12px;background:var(--surface2);color:var(--ink);width:100%;margin-top:6px}.success{color:var(--accent)}.warning{color:var(--amber)}.note{padding:12px 14px;border-left:3px solid var(--accent2);background:#12263a;border-radius:9px;font-size:12px;color:#c4d4e4;margin:12px 0}.weeks{display:flex;gap:6px;flex-wrap:wrap}.weekmark{border-radius:8px;background:var(--surface2);padding:7px 10px;color:var(--muted);font-size:12px}.kpis{display:flex;gap:9px;flex-wrap:wrap}.kpis span{background:#20334a;border-radius:8px;padding:5px 8px;color:#cce0f5;font-size:11px}.input-row{display:flex;gap:8px}.input-row .field{min-width:0}.input-row .btn{flex-shrink:0}.mini-green{color:var(--accent);font-size:12px;font-weight:700}.empty{text-align:center;padding:30px 18px;color:var(--muted)}.empty .big{font-size:36px;margin-bottom:8px}.canvas{margin:14px 0}::-webkit-scrollbar{width:5px}::-webkit-scrollbar-thumb{background:#32445f;border-radius:8px}@media(min-width:760px){main{padding-top:28px}.tabbar{position:sticky;max-width:740px;margin:auto;border:1px solid var(--line);border-radius:18px 18px 0 0}.app-head{padding-left:max(calc((100vw - 740px)/2),20px);padding-right:max(calc((100vw - 740px)/2),20px)}}
</style>
</head>
<body>
<header class="app-head">
  <div class="wordmark"><span class="logo">A</span><span>АТЛЕТ <small>FIT JOURNAL</small></span></div>
  <div class="header-icon" id="header-date"></div>
</header>
<main id="app"><p class="muted">Загружаем тренировку…</p></main>
<nav class="tabbar" id="tabbar">
  <button data-tab="home" class="active"><span class="tab-icon">⌂</span><span>Сегодня</span></button>
  <button data-tab="plan"><span class="tab-icon">▤</span><span>Программа</span></button>
  <button data-tab="progress"><span class="tab-icon">▥</span><span>Прогресс</span></button>
  <button data-tab="report"><span class="tab-icon">↗</span><span>Отчёт</span></button>
</nav>
<div id="toast" class="toast" role="status"></div>
<script>'use strict';
const PROGRAM=[
 {id:'A',name:'Грудь + всё тело',day:'Понедельник',focus:'Главный акцент — грудь',ex:[
  {id:'chestpress',name:'Жим в грудном тренажёре',muscle:'Грудь',sets:3,lo:8,hi:12,hint:'Лопатки сведены, опускание плавное. Без рывков.'},
  {id:'incline',name:'Жим гантелей под наклоном',muscle:'Грудь',sets:2,lo:8,hi:12,hint:'Наклон около 30°, не разводи локти строго в стороны.'},
  {id:'seatedrow',name:'Горизонтальная тяга блока',muscle:'Спина',sets:3,lo:10,hi:12,hint:'Тяни локти назад, не раскачивай корпус.'},
  {id:'legpress',name:'Жим ногами',muscle:'Ноги',sets:3,lo:10,hi:15,hint:'Не выпрямляй колени до жёсткой блокировки.'},
  {id:'lateral',name:'Махи гантелями в стороны',muscle:'Плечи',sets:3,lo:12,hi:20,hint:'Лёгкие гантели, движение без раскачивания.'},
  {id:'curl',name:'Сгибание рук с гантелями',muscle:'Бицепс',sets:2,lo:10,hi:15,hint:'Локти возле корпуса, без инерции.'},
  {id:'calves',name:'Подъёмы на носки в тренажёре',muscle:'Икры',sets:2,lo:12,hi:20,hint:'Поднимайся плавно и опускай пятки без рывка.'}
 ]},
 {id:'B',name:'Ноги + спина + плечи',day:'Среда',focus:'База для сильного тела',ex:[
  {id:'goblet',name:'Гоблет-присед с гантелью',muscle:'Ноги',sets:3,lo:8,hi:12,hint:'Спина нейтральна, колени направлены по линии стоп.'},
  {id:'latpull',name:'Тяга верхнего блока к груди',muscle:'Спина',sets:3,lo:8,hi:12,hint:'Тяни к верхней части груди, не за голову.'},
  {id:'rdl',name:'Румынская тяга с гантелями',muscle:'Ноги',sets:2,lo:8,hi:12,hint:'Отводи таз назад, сохраняй прямую спину.'},
  {id:'shoulderpress',name:'Жим гантелей сидя',muscle:'Плечи',sets:2,lo:8,hi:12,hint:'Не прогибай сильно поясницу.'},
  {id:'rear',name:'Обратная бабочка',muscle:'Задняя дельта',sets:2,lo:12,hi:20,hint:'Работай плечами, не поднимай трапеции.'},
  {id:'triceps',name:'Разгибание рук с канатом',muscle:'Трицепс',sets:2,lo:10,hi:15,hint:'Локти удерживай у тела.'},
  {id:'crunch',name:'Скручивания на пресс',muscle:'Пресс',sets:2,lo:12,hi:20,hint:'Двигайся медленно, без рывка шеей.'}
 ]},
 {id:'C',name:'Грудь + плечи + руки',day:'Пятница',focus:'Объём верха тела',ex:[
  {id:'incline',name:'Жим гантелей под наклоном',muscle:'Грудь',sets:3,lo:8,hi:12,hint:'Наклон около 30°, полный контролируемый ход.'},
  {id:'pecdeck',name:'Сведение рук в тренажёре',muscle:'Грудь',sets:2,lo:12,hi:15,hint:'Медленно своди руки, не перенапрягай плечи.'},
  {id:'seatedrow',name:'Горизонтальная тяга блока',muscle:'Спина',sets:3,lo:8,hi:12,hint:'Своди лопатки, сохраняй стабильный корпус.'},
  {id:'legcurl',name:'Сгибание ног в тренажёре',muscle:'Ноги',sets:3,lo:10,hi:15,hint:'Не отрывай таз от опоры.'},
  {id:'lateral',name:'Махи гантелями в стороны',muscle:'Плечи',sets:3,lo:12,hi:20,hint:'Держи плечи опущенными, не раскачивай корпус.'},
  {id:'hammer',name:'Молотковые сгибания',muscle:'Бицепс',sets:2,lo:10,hi:15,hint:'Запястья нейтральны, опускай вес медленно.'},
  {id:'overheadtriceps',name:'Разгибание рук на блоке из-за головы',muscle:'Трицепс',sets:2,lo:10,hi:15,hint:'Выбирай комфортную амплитуду, без боли в локте.'}
 ]}
];
const KEY='atlet_fit_v1';
function today(){let d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function initial(){return {version:1,started:today(),profile:{height:175,startWeight:70,goalWeight:74,calories:2600,protein:130},sessions:[],active:null,measurements:[],nutrition:{}}}
let state;try{state=JSON.parse(localStorage.getItem(KEY)||'null')||initial();if(!Array.isArray(state.sessions))throw Error('invalid state')}catch(e){state=initial()}
state.profile=Object.assign(initial().profile,state.profile||{});state.measurements=state.measurements||[];state.nutrition=state.nutrition||{};
let tab='home',selectedDay='A',reportRange=28,toastTimer;
const $=s=>document.querySelector(s);
function save(){localStorage.setItem(KEY,JSON.stringify(state))}
function esc(s){return String(s??'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]))}
function number(x){let v=Number(String(x).replace(',','.'));return Number.isFinite(v)&&v>=0?v:0}
function format(n,d=0){return Number(n||0).toLocaleString('ru-RU',{maximumFractionDigits:d})}
function niceDate(date){try{return new Date(date+'T12:00:00').toLocaleDateString('ru-RU',{day:'numeric',month:'short',year:'numeric'})}catch(e){return date}}
function getDay(){let n=new Date().getDay();return n===3?'B':n===5?'C':'A'}
function toast(message){let e=$('#toast');e.textContent=message;e.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>e.classList.remove('show'),2400)}
function nav(t){tab=t;render();window.scrollTo(0,0)}
function allExercises(){let ex={};PROGRAM.forEach(d=>d.ex.forEach(x=>ex[x.id]=x));return ex}
function getRecentSet(id,index){for(let i=state.sessions.length-1;i>=0;i--){let t=state.sessions[i].sets.filter(s=>s.exId===id&&s.done);if(t.length)return t[index]||t[t.length-1]}return null}
function weeksSinceStart(){let diff=new Date(today()+'T12:00:00')-new Date(state.started+'T12:00:00');return Math.max(1,Math.floor(diff/604800000)+1)}
function prescribedSets(ex){return Math.max(1,ex.sets-(weeksSinceStart()<=2?1:0))}
function makeSession(id){let d=PROGRAM.find(p=>p.id===id);return {id:Date.now(),date:today(),day:id,startedAt:new Date().toISOString(),notes:'',sets:d.ex.flatMap(ex=>Array.from({length:prescribedSets(ex)},(_,i)=>{let prev=getRecentSet(ex.id,i);return {exId:ex.id,weight:prev?.weight||'',reps:prev?.reps||'',done:false}}))}}
function startDay(){if(state.active&&state.active.day!==selectedDay){if(!confirm('Текущая незаконченная тренировка будет заменена. Продолжить?'))return}if(!state.active||state.active.day!==selectedDay)state.active=makeSession(selectedDay);save();render()}
function cancelDay(){if(!confirm('Удалить незавершённую тренировку?'))return;state.active=null;save();render()}
function finishDay(){if(!state.active)return;let done=state.active.sets.filter(x=>x.done&&number(x.reps)>0);if(!done.length){toast('Отметь хотя бы один выполненный подход');return}if(!confirm('Завершить тренировку? Выполнено подходов: '+done.length))return;state.sessions.push({...state.active,endedAt:new Date().toISOString()});state.active=null;save();toast('Тренировка сохранена!');nav('progress')}
function editSet(i,field,val){if(!state.active||!state.active.sets[i])return;state.active.sets[i][field]=field==='done'?!!val:val;save();if(field==='done'){let row=document.querySelector('[data-setrow="'+i+'"]');if(row)row.classList.toggle('done',!!val);updateSessionCount()}}
function editNote(val){if(!state.active)return;state.active.notes=val;save()}
function addSet(id){if(!state.active)return;let last=state.active.sets.filter(x=>x.exId===id).slice(-1)[0];let idx=state.active.sets.findLastIndex?state.active.sets.findLastIndex(x=>x.exId===id):state.active.sets.map(x=>x.exId).lastIndexOf(id);state.active.sets.splice(idx+1,0,{exId:id,weight:last?.weight||'',reps:last?.reps||'',done:false});save();render()}
function removeSet(id){if(!state.active)return;let a=state.active.sets.filter(x=>x.exId===id);if(a.length<=1){toast('Нужен хотя бы один подход');return}let idx=state.active.sets.map(x=>x.exId).lastIndexOf(id);state.active.sets.splice(idx,1);save();render()}
function updateSessionCount(){let d=$('#done-counter');if(d&&state.active)d.textContent=state.active.sets.filter(s=>s.done).length+' / '+state.active.sets.length+' подходов'}
function graph(points){if(!points.length)return '<p class="muted small">Добавь первый замер для графика.</p>';let vals=points.map(p=>number(p.weight)).filter(x=>x>0);if(!vals.length)return '<p class="muted small">Нет данных о весе.</p>';let lo=Math.min(...vals)-.5,hi=Math.max(...vals)+.5,range=Math.max(hi-lo,1);let W=310,H=136,x=i=>25+(points.length===1?130:i*260/(points.length-1)),y=v=>116-(v-lo)*92/range;let path=points.map((p,i)=>(i?'L':'M')+x(i).toFixed(1)+','+y(number(p.weight)).toFixed(1)).join(' ');let dots=points.map((p,i)=>`<circle cx="${x(i)}" cy="${y(number(p.weight))}" r="3.8" fill="#4ce7bb" />`).join('');return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="График изменения веса"><line x1="25" y1="22" x2="25" y2="117" stroke="#43546a"/><line x1="25" y1="117" x2="293" y2="117" stroke="#43546a"/><text x="2" y="27" fill="#94a6c0" font-size="9">${hi.toFixed(1)}</text><text x="2" y="118" fill="#94a6c0" font-size="9">${lo.toFixed(1)}</text><path d="${path}" fill="none" stroke="#4ce7bb" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>${dots}</svg>`}
function summary(days){let cutoff=new Date();cutoff.setDate(cutoff.getDate()-days+1);let dt=cutoff.getFullYear()+'-'+String(cutoff.getMonth()+1).padStart(2,'0')+'-'+String(cutoff.getDate()).padStart(2,'0');let ss=state.sessions.filter(s=>days===0||s.date>=dt),sets=ss.flatMap(s=>s.sets.filter(x=>x.done&&number(x.reps)>0));let volume=sets.reduce((acc,s)=>acc+number(s.weight)*number(s.reps),0);let byMuscle={};let dict=allExercises();sets.forEach(s=>{let g=dict[s.exId]?.muscle||'Другое';byMuscle[g]=(byMuscle[g]||0)+1});let meas=state.measurements.filter(m=>number(m.weight)>0).sort((a,b)=>a.date.localeCompare(b.date));let recent=meas.slice(-2),change=recent.length===2?number(recent[1].weight)-number(recent[0].weight):null;return {trainings:ss.length,sets:sets.length,volume:Math.round(volume),muscles:byMuscle,weightChange:change,sessions:ss}}
function homeView(){let last=state.measurements.slice().sort((a,b)=>b.date.localeCompare(a.date))[0];let weight=last?.weight||state.profile.startWeight;let s=summary(28);let next=PROGRAM.find(p=>p.id===getDay())||PROGRAM[0];return `<div class="eyebrow">ТВОЙ ПЛАН НА МАССУ</div><h1 class="page-title">Сильнее каждую неделю.</h1><div class="hero"><span class="pill">Неделя ${weeksSinceStart()} · 3 тренировки / нед.</span><h1>Грудь. Плечи.<br>Всё тело.</h1><p>Выполняй упражнения по технике, записывай подходы и отслеживай прогресс.</p><button class="btn btn-primary" id="go-train">${state.active?'Продолжить тренировку →':'Начать тренировку →'}</button></div><div class="grid2" style="margin-top:12px"><div class="stat"><div class="stat-label">Текущий вес</div><div class="stat-value">${format(weight,1)}<span class="stat-unit">кг</span></div></div><div class="stat"><div class="stat-label">Тренировки за 28 дней</div><div class="stat-value">${s.trainings}<span class="stat-unit">из ~12</span></div></div><div class="stat"><div class="stat-label">Белок / день</div><div class="stat-value">${state.profile.protein}<span class="stat-unit">г</span></div></div><div class="stat"><div class="stat-label">Первая цель по весу</div><div class="stat-value">${format(state.profile.goalWeight,1)}<span class="stat-unit">кг</span></div></div></div><h2 class="section-title">План на сегодня</h2><div class="card"><div class="between"><div><b>${esc(next.day)} · тренировка ${next.id}</b><p class="muted small no-margin">${esc(next.name)}</p></div><span class="pill blue">${next.ex.length} упражн.</span></div><div class="line"></div><div class="small muted">В другие дни — восстановление. Выбирай тренировку вручную, если график изменился.</div><div class="space"></div><button class="btn btn-secondary btn-full" id="plan-shortcut">Посмотреть программу →</button></div><h2 class="section-title">Питание за сегодня</h2>${nutritionCard()}<h2 class="section-title">Измерения тела</h2><div class="card"><p class="small muted">Контролируй массу тела и обхваты раз в 2–4 недели.</p><button class="btn btn-secondary btn-full" id="measure-shortcut">Записать замеры</button></div>`}
function nutritionCard(){let x=state.nutrition[today()]||{};return `<div class="card"><div class="grid2"><div><label class="label" for="food-cal">Калории, ккал</label><input class="field" id="food-cal" type="number" min="0" placeholder="Цель ${state.profile.calories}" value="${esc(x.calories??'')}"></div><div><label class="label" for="food-pro">Белок, г</label><input class="field" id="food-pro" type="number" min="0" placeholder="Цель ${state.profile.protein}" value="${esc(x.protein??'')}"></div></div><div class="space"></div><button class="btn btn-primary btn-full" id="save-food">Записать питание за сегодня</button></div>`}
function sessionView(){let active=state.active;let day=PROGRAM.find(x=>x.id===(active?.day||selectedDay))||PROGRAM[0];let sets=active?.sets||[];let done=sets.filter(s=>s.done).length;return `<div class="eyebrow">ТРЕНИРОВОЧНЫЙ ДНЕВНИК</div><h1 class="page-title">${active?'Идёт тренировка':'Выбери тренировку'}</h1>${!active?`<p class="muted small">Понедельник / Среда / Пятница. При переносе занятий выбирай нужный день вручную.</p><div class="day-pick">${PROGRAM.map(d=>`<button data-day="${d.id}" class="${selectedDay===d.id?'active':''}"><b>${d.day}</b><span>${d.id}</span></button>`).join('')}</div><div class="card"><span class="pill">Тренировка ${day.id}</span><h2>${esc(day.name)}</h2><p class="muted small">${esc(day.focus)} · ${day.ex.length} упражнений</p><div class="note">Недели 1–2: по одному рабочему подходу меньше в каждом упражнении. Не тренируйся через острую боль. Держи 2–3 повторения в запасе.</div><button id="start" class="btn btn-primary btn-full">Начать тренировку ${day.id}</button></div>`:`<div class="card"><div class="between"><b>Тренировка ${day.id} · ${esc(day.name)}</b><span class="pill">${esc(niceDate(active.date))}</span></div><div class="space"></div><div class="between"><span class="muted small" id="done-counter">${done} / ${sets.length} подходов</span><span class="mini-green">Вес в кг · повторы</span></div><div class="progressline"><span style="width:${sets.length?100*done/sets.length:0}%"></span></div></div>${day.ex.map(ex=>{let rows=sets.map((s,i)=>({...s,index:i})).filter(s=>s.exId===ex.id);return `<div class="exercise"><div class="exo-head"><div><div class="exercise-name">${esc(ex.name)}</div><div class="ex-info">${esc(ex.muscle)} · ${ex.lo}–${ex.hi} повторений · ${rows.length} подход.</div></div><span class="pill blue">${esc(ex.muscle)}</span></div><div class="set-head"><span>№</span><span>Вес, кг</span><span>Повторы</span><span>✓</span></div>${rows.map((s,i)=>`<div class="setrow ${s.done?'done':''}" data-setrow="${s.index}"><span class="setnum">${i+1}</span><input aria-label="Вес, кг" data-set="${s.index}" data-field="weight" class="field" type="number" inputmode="decimal" min="0" step="0.5" value="${esc(s.weight)}" placeholder="0"><input aria-label="Повторения" data-set="${s.index}" data-field="reps" class="field" type="number" inputmode="numeric" min="0" max="100" value="${esc(s.reps)}" placeholder="0"><input aria-label="Подход выполнен" data-set="${s.index}" data-field="done" type="checkbox" class="check" ${s.done?'checked':''}></div>`).join('')}<div class="between"><button class="btn btn-small btn-secondary" data-add="${ex.id}">+ Подход</button><button class="btn btn-small btn-outline" data-remove="${ex.id}">− Подход</button></div><div class="ex-hint">${esc(ex.hint)}</div></div>`}).join('')}<div class="card"><label class="label">Заметка к тренировке (сон, самочувствие, техника)</label><textarea id="session-note" class="field" placeholder="Например: последние повторы дались тяжело">${esc(active.notes)}</textarea><div class="space"></div><button id="finish" class="btn btn-primary btn-full">✓ Завершить и сохранить тренировку</button><div class="space"></div><button id="cancel" class="btn btn-danger btn-full">Отменить тренировку</button></div>`}`}
function planView(){return `<div class="eyebrow">ПРОГРАММА / 12 НЕДЕЛЬ</div><h1 class="page-title">Всё тело. Акцент на грудь и плечи.</h1><p class="muted small">3 занятия в неделю, с перерывом минимум 1 день между ними. Продолжительность обычно 55–80 минут.</p><div class="card"><div class="between"><b>Прогрессия нагрузки</b><span class="pill">Неделя ${weeksSinceStart()}</span></div><p class="small muted">1–2 недели: осваивай технику, меньше подходов. С 3-й недели выполняй все подходы из плана, если нормально восстанавливаешься.</p><p class="small muted">Достиг верхнего числа повторов во всех подходах с хорошей техникой — увеличь вес на минимальный доступный шаг.</p><div class="note">Перед тренировкой — разминка 5–10 минут и лёгкие разминочные подходы. Отдых 2–3 мин после тяжёлых жимов/тяг, 60–90 сек после изоляции.</div></div>${PROGRAM.map(d=>`<h2 class="section-title">${d.day} — ${d.name}</h2><div class="card"><span class="pill blue">День ${d.id}</span>${d.ex.map(e=>`<div class="list-item"><div class="between"><b class="small">${esc(e.name)}</b><span class="pill">${e.sets}×${e.lo}–${e.hi}</span></div><span class="muted tiny">${esc(e.muscle)}</span></div>`).join('')}<div class="space"></div><button class="btn btn-secondary btn-full" data-startday="${d.id}">Записать тренировку ${d.id} →</button></div>`).join('')}<div class="card"><b>Почему нет ежедневных тренировок?</b><p class="small muted">Мышцы растут при сочетании нагрузки и восстановления. Для новичка три полноценные тренировки часто эффективнее ежедневного максимального объёма. Если техника незнакома — попроси тренера проверить первые занятия.</p></div>`}
function measureView(){let ms=state.measurements.slice().sort((a,b)=>a.date.localeCompare(b.date));let latest=ms.slice(-1)[0];let chartData=ms.filter(m=>number(m.weight)>0);if(!chartData.length)chartData=[{date:state.started,weight:state.profile.startWeight}];return `<div class="eyebrow">ДИНАМИКА</div><h1 class="page-title">Твоя форма в цифрах</h1><div class="grid2"><div class="stat"><div class="stat-label">Тренировок всего</div><div class="stat-value">${state.sessions.length}</div></div><div class="stat"><div class="stat-label">Подходов за 28 дней</div><div class="stat-value">${summary(28).sets}</div></div></div><h2 class="section-title">Масса тела</h2><div class="card"><div class="between"><div><span class="muted small">Последнее измерение</span><div class="stat-value">${format(latest?.weight||state.profile.startWeight,1)} <span class="stat-unit">кг</span></div></div><span class="pill">Цель ${state.profile.goalWeight} кг</span></div><div class="canvas">${graph(chartData.slice(-12))}</div></div><h2 class="section-title">Добавить замеры</h2><div class="card"><div class="formgrid"><div><label class="label">Дата</label><input type="date" id="measure-date" class="field" value="${today()}"></div><div><label class="label">Вес, кг</label><input type="number" min="0" step="0.1" inputmode="decimal" id="measure-weight" placeholder="70.0" class="field"></div><div><label class="label">Грудь, см</label><input type="number" min="0" step="0.1" id="measure-chest" placeholder="—" class="field"></div><div><label class="label">Обхват плеч, см</label><input type="number" min="0" step="0.1" id="measure-shoulders" placeholder="—" class="field"></div><div><label class="label">Бицепс, см</label><input type="number" min="0" step="0.1" id="measure-arm" placeholder="—" class="field"></div><div><label class="label">Талия, см</label><input type="number" min="0" step="0.1" id="measure-waist" placeholder="—" class="field"></div></div><div class="space"></div><button class="btn btn-primary btn-full" id="save-measure">Сохранить замеры</button></div><h2 class="section-title">История замеров</h2><div class="card">${ms.length?ms.slice().reverse().map(m=>`<div class="list-item"><div class="between"><b>${niceDate(m.date)}</b><span class="pill">${m.weight?format(m.weight,1)+' кг':'без веса'}</span></div><div class="kpis">${[['Грудь',m.chest],['Плечи',m.shoulders],['Бицепс',m.arm],['Талия',m.waist]].filter(a=>a[1]).map(a=>`<span>${a[0]} ${format(a[1],1)} см</span>`).join('')}</div></div>`).join(''):'<p class="muted small">Пока замеров нет. Добавь первый.</p>'}</div><h2 class="section-title">История тренировок</h2><div class="card">${state.sessions.length?state.sessions.slice().reverse().slice(0,12).map(s=>`<div class="list-item"><div class="between"><b>${niceDate(s.date)} · день ${esc(s.day)}</b><span class="pill blue">${s.sets.filter(x=>x.done).length} подход.</span></div><p class="muted tiny no-margin">${esc(s.notes||'Без заметок')}</p></div>`).join(''):'<p class="muted small">Ещё нет завершённых тренировок.</p>'}</div>`}
function saveMeasure(){let d=$('#measure-date').value||today(),r={date:d};for(let x of ['weight','chest','shoulders','arm','waist']){let v=$('#measure-'+x).value;r[x]=v===''?null:number(v)}if(!Object.entries(r).some(([k,v])=>k!=='date'&&v>0)){toast('Укажи хотя бы один замер');return}state.measurements.push(r);save();toast('Замеры сохранены');render()}
function reportText(){let z=summary(reportRange),first=state.measurements.slice().sort((a,b)=>a.date.localeCompare(b.date))[0],last=state.measurements.slice().sort((a,b)=>a.date.localeCompare(b.date)).slice(-1)[0];let lines=[`АТЛЕТ — отчёт о тренировках`, `Дата отчёта: ${niceDate(today())}`,`Период: ${reportRange?'последние '+reportRange+' дней':'всё время'}`,`Рост: ${state.profile.height} см`, `Начальный вес: ${state.profile.startWeight} кг`, `Цель: ${state.profile.goalWeight} кг`, `Тренировок: ${z.trainings}`,`Выполнено подходов: ${z.sets}`, `Суммарный тренировочный объём: ${format(z.volume)} кг×повт. (вес тела и незаписанный вес не учитываются)`, `Подходы по группам: ${Object.entries(z.muscles).map(([k,v])=>k+' — '+v).join('; ')||'нет записей'}`];if(last)lines.push(`Последние замеры (${last.date}): вес ${last.weight||'—'} кг; грудь ${last.chest||'—'} см; плечи ${last.shoulders||'—'} см; бицепс ${last.arm||'—'} см; талия ${last.waist||'—'} см`);if(first&&last&&first!==last&&first.weight&&last.weight)lines.push(`Изменение веса между замерами: ${(number(last.weight)-number(first.weight)).toFixed(1)} кг`);let days=Object.keys(state.nutrition).filter(d=>reportRange===0||d>=new Date(Date.now()-(reportRange-1)*86400000).toISOString().slice(0,10));if(days.length){let avg=(key)=>Math.round(days.reduce((s,d)=>s+number(state.nutrition[d][key]),0)/days.length);lines.push(`Питание (дней с записью: ${days.length}): средняя калорийность ${avg('calories')} ккал; белок ${avg('protein')} г`)}lines.push('');for(let sess of z.sessions.slice(-15)){lines.push(`${sess.date} — тренировка ${sess.day}${sess.notes?' · '+sess.notes:''}`);let groups={};sess.sets.filter(s=>s.done).forEach(s=>(groups[s.exId]??=[]).push((s.weight||0)+' кг × '+(s.reps||0)));for(let [id,sets] of Object.entries(groups))lines.push(`  ${allExercises()[id]?.name||id}: ${sets.join(', ')}`)}lines.push('', 'Пожалуйста, оцени восстановление, прогресс, объём нагрузки и предложи корректировку программы на следующие 4 недели.');return lines.join('\n')}
function reportJson(){return JSON.stringify({schema:'atlet-fit-report-v1',exportedAt:new Date().toISOString(),periodDays:reportRange,profile:state.profile,started:state.started,summary:summary(reportRange),plan:PROGRAM,measurements:state.measurements,nutrition:state.nutrition,sessions:state.sessions,active:state.active},null,2)}
function downloadReport(){let name='ATLET_report_'+today()+'.json',json=reportJson();if(window.Native?.exportJson)window.Native.exportJson(json,name);else{let blob=new Blob([json],{type:'application/json;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),3000)}toast('Выбери папку для отчёта')}
function shareReport(){let txt=reportText();if(window.Native?.shareText)window.Native.shareText(txt);else if(navigator.share)navigator.share({text:txt,title:'АТЛЕТ — отчёт'}).catch(()=>{});else if(navigator.clipboard)navigator.clipboard.writeText(txt).then(()=>toast('Отчёт скопирован'));else toast('Используй экспорт JSON')}
function restoreReport(raw){let incoming;try{incoming=JSON.parse(raw)}catch(e){toast('Неверный формат JSON');return}let s=incoming?.schema==='atlet-fit-report-v1'?incoming:incoming;if(!Array.isArray(s.sessions)||!Array.isArray(s.measurements)||!s.profile){toast('Это не резервная копия АТЛЕТ');return}if(!confirm('Заменить данные приложения из этого файла? Текущие записи будут перезаписаны.'))return;state={version:1,started:s.started||today(),profile:s.profile,sessions:s.sessions,active:s.active||null,measurements:s.measurements,nutrition:s.nutrition||{}};save();toast('Данные восстановлены');nav('home')}
window.restoreFromNative=restoreReport;

function reportView(){let z=summary(reportRange);return `<div class="eyebrow">ОТЧЁТ ДЛЯ CHATGPT</div><h1 class="page-title">Отправь мне прогресс</h1><p class="muted small">Здесь собираются записи о тренировках, весах, повторениях, замерах и питании. Отчёт можно переслать в ChatGPT для корректировки плана.</p><div class="day-pick"><button data-range="28" class="${reportRange===28?'active':''}"><b>28 дней</b><span>Недавний</span></button><button data-range="84" class="${reportRange===84?'active':''}"><b>12 недель</b><span>Курс</span></button><button data-range="0" class="${reportRange===0?'active':''}"><b>Всё</b><span>История</span></button></div><div class="grid2" style="margin-top:12px"><div class="stat"><div class="stat-label">Тренировки</div><div class="stat-value">${z.trainings}</div></div><div class="stat"><div class="stat-label">Рабочие подходы</div><div class="stat-value">${z.sets}</div></div><div class="stat"><div class="stat-label">Объём, кг×повт.</div><div class="stat-value">${format(z.volume)}</div></div><div class="stat"><div class="stat-label">Записей замеров</div><div class="stat-value">${state.measurements.length}</div></div></div><div class="card"><b>Экспорт</b><p class="muted small">Лучший способ: сохрани JSON-файл и прикрепи его в чат. В нём сохраняются все упражнения, подходы и замеры.</p><button class="btn btn-primary btn-full" id="export">↓ Сохранить отчёт JSON</button><div class="space"></div><button class="btn btn-secondary btn-full" id="share">↗ Поделиться текстовым отчётом</button></div><div class="card"><b>Твой профиль и питание</b><div class="space"></div><div class="formgrid"><div><label class="label">Рост, см</label><input type="number" class="field" id="profile-height" value="${state.profile.height}"></div><div><label class="label">Цель, кг</label><input type="number" step="0.1" class="field" id="profile-goalWeight" value="${state.profile.goalWeight}"></div><div><label class="label">Цель калорий, ккал</label><input type="number" class="field" id="profile-calories" value="${state.profile.calories}"></div><div><label class="label">Цель белка, г</label><input type="number" class="field" id="profile-protein" value="${state.profile.protein}"></div></div><div class="space"></div><button class="btn btn-secondary btn-full" id="profile-save">Сохранить цели</button></div><div class="card"><b>Резервная копия</b><p class="muted small">Приложение хранит данные только на устройстве. Экспортируй отчёт регулярно. Удаление приложения может удалить журнал.</p><button class="btn btn-outline btn-full" id="import">↑ Восстановить данные из JSON</button><input id="import-input" type="file" accept="application/json,.json" style="display:none"></div><p class="muted tiny">Нет регистрации, рекламы, аналитики и отправки данных на сервер. Отчёт передаётся только когда ты самостоятельно выбираешь экспорт или отправку.</p>`}
function render(){document.getElementById('header-date').textContent=new Date().toLocaleDateString('ru-RU',{day:'numeric',month:'short'});document.querySelectorAll('#tabbar button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));$('#app').innerHTML=tab==='home'?homeView():tab==='plan'?planView():tab==='progress'?measureView():tab==='report'?reportView():sessionView();bind()}
function bind(){document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>nav(b.dataset.tab));let e=id=>document.getElementById(id);if(e('go-train'))e('go-train').onclick=()=>{selectedDay=state.active?.day||getDay();tab='session';render()};if(e('plan-shortcut'))e('plan-shortcut').onclick=()=>nav('plan');if(e('measure-shortcut'))e('measure-shortcut').onclick=()=>nav('progress');if(e('save-food'))e('save-food').onclick=()=>{state.nutrition[today()]={calories:number(e('food-cal').value),protein:number(e('food-pro').value)};save();toast('Питание сохранено')};document.querySelectorAll('[data-day]').forEach(b=>b.onclick=()=>{selectedDay=b.dataset.day;render()});if(e('start'))e('start').onclick=startDay;if(e('finish'))e('finish').onclick=finishDay;if(e('cancel'))e('cancel').onclick=cancelDay;document.querySelectorAll('[data-set]').forEach(input=>{input.onchange=()=>editSet(Number(input.dataset.set),input.dataset.field,input.type==='checkbox'?input.checked:input.value)});document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>addSet(b.dataset.add));document.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>removeSet(b.dataset.remove));if(e('session-note'))e('session-note').onchange=x=>editNote(x.target.value);document.querySelectorAll('[data-startday]').forEach(b=>b.onclick=()=>{selectedDay=b.dataset.startday;tab='session';render()});if(e('save-measure'))e('save-measure').onclick=saveMeasure;document.querySelectorAll('[data-range]').forEach(b=>b.onclick=()=>{reportRange=Number(b.dataset.range);render()});if(e('export'))e('export').onclick=downloadReport;if(e('share'))e('share').onclick=shareReport;if(e('import'))e('import').onclick=importReport;if(e('import-input'))e('import-input').onchange=ev=>{let f=ev.target.files?.[0];if(!f)return;let r=new FileReader();r.onload=()=>restoreReport(r.result);r.readAsText(f)};if(e('profile-save'))e('profile-save').onclick=()=>{for(let k of ['height','goalWeight','calories','protein'])state.profile[k]=number(e('profile-'+k).value);save();toast('Цели сохранены');render()}}
render();
</script>
